<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>Employees</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><nav><b>EMS</b><a href="/">Dashboard</a><a href="/employees">Employees</a><a href="/departments">Departments</a><a href="/attendance">Attendance</a><a href="/salary">Salary</a><a href="/leaves">Leaves</a><form th:action="@{/logout}" method="post"><button class="link">Logout</button></form></nav><main><div class="heading"><h1>Employees</h1><a class="button" href="/employees/new">+ Add Employee</a></div><table><tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Designation</th><th>Department</th><th>Status</th><th>Actions</th></tr><tr th:each="e:${employees}"><td th:text="${e.id}"></td><td th:text="${e.fullName}"></td><td th:text="${e.email}"></td><td th:text="${e.phone}"></td><td th:text="${e.designation}"></td><td th:text="${e.department!=null?e.department.name:'-'}"></td><td th:text="${e.status}"></td><td><a th:href="@{/employees/edit/{id}(id=${e.id})}">Edit</a> | <a th:href="@{/employees/delete/{id}(id=${e.id})}" onclick="return confirm('Delete employee?')">Delete</a></td></tr></table></main></body></html>
