<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>Employee Form</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><nav><b>EMS</b><a href="/">Dashboard</a><a href="/employees">Employees</a><a href="/departments">Departments</a><a href="/attendance">Attendance</a><a href="/salary">Salary</a><a href="/leaves">Leaves</a></nav><main><h1>Employee Details</h1><form class="panel formgrid" th:action="@{/employees/save}" th:object="${employee}" method="post"><input type="hidden" th:field="*{id}"><label>First name</label><input th:field="*{firstName}" required><label>Last name</label><input th:field="*{lastName}" required><label>Email</label><input type="email" th:field="*{email}" required><label>Phone</label><input th:field="*{phone}"><label>Designation</label><input th:field="*{designation}"><label>Joining date</label><input type="date" th:field="*{joiningDate}"><label>Salary</label><input type="number" step="0.01" th:field="*{salary}"><label>Status</label><select th:field="*{status}"><option>ACTIVE</option><option>INACTIVE</option></select><label>Department</label><select name="departmentId"><option value="">-- Select --</option><option th:each="d:${departments}" th:value="${d.id}" th:text="${d.name}" th:selected="${employee.department!=null and employee.department.id==d.id}"></option></select><button>Save Employee</button><a href="/employees">Cancel</a></form></main></body></html>
