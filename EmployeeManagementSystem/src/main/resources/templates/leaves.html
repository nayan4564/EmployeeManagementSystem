<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>Leaves</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><nav><b>EMS</b><a href="/">Dashboard</a><a href="/employees">Employees</a><a href="/departments">Departments</a><a href="/attendance">Attendance</a><a href="/salary">Salary</a><a href="/leaves">Leaves</a><form th:action="@{/logout}" method="post"><button class="link">Logout</button></form></nav><main><h1>Leave Management</h1><form class="inline panel" th:action="@{/leaves/save}" th:object="${leave}" method="post"><select name="employeeId" required><option value="">Employee</option><option th:each="e:${employees}" th:value="${e.id}" th:text="${e.fullName}"></option></select><input type="date" th:field="*{fromDate}" required><input type="date" th:field="*{toDate}" required><input placeholder="Reason" th:field="*{reason}" required><button>Submit request</button></form><table><tr><th>Employee</th><th>From</th><th>To</th><th>Reason</th><th>Status</th><th>Action</th></tr><tr th:each="l:${leaves}"><td th:text="${l.employee.fullName}"></td><td th:text="${l.fromDate}"></td><td th:text="${l.toDate}"></td><td th:text="${l.reason}"></td><td th:text="${l.status}"></td><td><a th:href="@{/leaves/status/{id}/{status}(id=${l.id},status='APPROVED')}">Approve</a> | <a th:href="@{/leaves/status/{id}/{status}(id=${l.id},status='REJECTED')}">Reject</a></td></tr></table></main></body></html>
