<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>Departments</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><nav><b>EMS</b><a href="/">Dashboard</a><a href="/employees">Employees</a><a href="/departments">Departments</a><a href="/attendance">Attendance</a><a href="/salary">Salary</a><a href="/leaves">Leaves</a><form th:action="@{/logout}" method="post"><button class="link">Logout</button></form></nav><main><h1>Departments</h1><form class="inline panel" th:action="@{/departments/save}" th:object="${department}" method="post"><input placeholder="Department name" th:field="*{name}" required><input placeholder="Description" th:field="*{description}"><button>Add department</button></form><table><tr><th>ID</th><th>Name</th><th>Description</th><th>Action</th></tr><tr th:each="d:${departments}"><td th:text="${d.id}"></td><td th:text="${d.name}"></td><td th:text="${d.description}"></td><td><a th:href="@{/departments/delete/{id}(id=${d.id})}" onclick="return confirm('Delete department?')">Delete</a></td></tr></table></main></body></html>
