<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>Salary</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><nav><b>EMS</b><a href="/">Dashboard</a><a href="/employees">Employees</a><a href="/departments">Departments</a><a href="/attendance">Attendance</a><a href="/salary">Salary</a><a href="/leaves">Leaves</a><form th:action="@{/logout}" method="post"><button class="link">Logout</button></form></nav><main><h1>Salary Management</h1><form class="inline panel" th:action="@{/salary/save}" th:object="${salary}" method="post"><select name="employeeId" required><option value="">Employee</option><option th:each="e:${employees}" th:value="${e.id}" th:text="${e.fullName}"></option></select><input type="number" min="1" max="12" placeholder="Month" th:field="*{payMonth}" required><input type="number" placeholder="Year" th:field="*{payYear}" required><input type="number" step=".01" placeholder="Basic" th:field="*{basic}"><input type="number" step=".01" placeholder="Allowance" th:field="*{allowance}"><input type="number" step=".01" placeholder="Deduction" th:field="*{deduction}"><button>Save salary</button></form><table><tr><th>Employee</th><th>Month</th><th>Year</th><th>Basic</th><th>Allowance</th><th>Deduction</th><th>Net salary</th></tr><tr th:each="s:${salaries}"><td th:text="${s.employee.fullName}"></td><td th:text="${s.payMonth}"></td><td th:text="${s.payYear}"></td><td th:text="${s.basic}"></td><td th:text="${s.allowance}"></td><td th:text="${s.deduction}"></td><td th:text="${s.netSalary}"></td></tr></table></main></body></html>
