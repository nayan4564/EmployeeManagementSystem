<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>Attendance</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><nav><b>EMS</b><a href="/">Dashboard</a><a href="/employees">Employees</a><a href="/departments">Departments</a><a href="/attendance">Attendance</a><a href="/salary">Salary</a><a href="/leaves">Leaves</a><form th:action="@{/logout}" method="post"><button class="link">Logout</button></form></nav><main><h1>Attendance</h1><form class="inline panel" th:action="@{/attendance/save}" th:object="${record}" method="post"><select name="employeeId" required><option value="">Employee</option><option th:each="e:${employees}" th:value="${e.id}" th:text="${e.fullName}"></option></select><input type="date" th:field="*{attendanceDate}" required><select th:field="*{status}"><option> PRESENT</option><option>ABSENT</option><option>HALF_DAY</option></select><button>Save attendance</button></form><table><tr><th>Employee</th><th>Date</th><th>Status</th></tr><tr th:each="a:${records}"><td th:text="${a.employee.fullName}"></td><td th:text="${a.attendanceDate}"></td><td th:text="${a.status}"></td></tr></table></main></body></html>
